name: Publish plugin release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['little-studio-elementor.php', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.4.0
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.8'
            elementor: '3.28.4'
          - php: '8.3'
            wordpress: '7.1.4'
            elementor: '4.4.0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Verify minimum and current WordPress / Elementor packages
        env:
          LSE_TEST_PHP: ${{ matrix.php }}
          LSE_TEST_WORDPRESS: ${{ matrix.wordpress }}
          LSE_TEST_ELEMENTOR: ${{ matrix.elementor }}
        run: node tests/run.mjs
      - name: Verify actual SEO provider output
        if: matrix.php == '8.3'
        run: node tests/seo-regression.mjs
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve plugin version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -e "const fs=require('fs'); const s=fs.readFileSync('little-studio-elementor.php','utf8'); console.log(s.match(/Version:\s*(\d+\.\d+\.\d+)/)[1]);")
          TAG="v$VERSION"
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$TAG" ]; then exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then exit 1; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build the verified plugin package
        run: node scripts/package.mjs . dist
      - name: Attach and publish release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/lse-release-state; then
            if [ "$(cat /tmp/lse-release-state)" = "false" ]; then
              echo "This release is already published; its assets are unchanged."
              exit 0
            fi
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /tmp/lse-tag.json; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          else
            TAG_SHA=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/lse-tag.json')).object.sha")
            CURRENT_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" != "$CURRENT_SHA" ]; then
              echo "The version tag points to different code. Refusing to publish."
              exit 1
            fi
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Little Studio to Elementor $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" "dist/little-studio-elementor-$PLUGIN_VERSION.zip" dist/update.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
